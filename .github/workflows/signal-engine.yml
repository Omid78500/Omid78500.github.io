name: Signal engine (gold + nasdaq + crypto)

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Analyse market, news, sentiment, derivatives, calendar
        run: node engine/engine.mjs
      - name: Save results
        run: |
          if [ -n "$(git status --porcelain btc/engine)" ]; then
            git config user.name "signal-engine"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add btc/engine
            git commit -m "signal engine: update [skip ci]"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
