name: BTC paper bot

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may delay)
  workflow_dispatch:

permissions:
  contents: write

# Only one run at a time, so two signals can never push spending past the cap.
concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run bot (Alpaca PAPER account only)
        run: node bot/paper-bot.mjs
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Save results
        run: |
          if [ -n "$(git status --porcelain btc/paper)" ]; then
            git config user.name "btc-paper-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add btc/paper
            git commit -m "paper bot: update [skip ci]"
            git pull --rebase origin main
            git push
          fi
